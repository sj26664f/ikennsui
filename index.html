<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>診療科クイズ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="quiz-container">
    <h2>診療科クイズ（問題番号で選択）</h2>

    <div class="layer-select">
        <label>出題する問題番号：</label>
        <select id="layer-choice">
            <option value="all">すべての問題</option>
            <option value="1">問1</option>
            <option value="2">問2</option>
            <option value="3">問3</option>
            <option value="4">問4</option>
            <option value="5">問5</option>
            <option value="6">問6</option>
            <option value="7">問7</option>
        </select>
    </div>

    <div class="question-box">
        <p><strong>【症状】</strong></p>
        <p id="question-text"></p>
    </div>

    <div id="options-group" class="options-group"></div>

    <button id="submit-btn" class="submit-btn">回答を送信する</button>

    <div id="result-area" class="result-area hidden">
        <hr>
        <div id="result-status"></div>

        <div class="explanation-box">
            <p><strong>【解説】</strong></p>
            <p id="explanation-text"></p>

            <p><strong>【出典】</strong></p>
            <a id="source-link" href="#" target="_blank"></a>
        </div>

        <button id="next-btn" class="next-btn hidden">次の問題へ進む</button>
    </div>
</div>

<p class="disclaimer">
    ※このページは医学生がプログラミングを学ぶために作成したものであり、医療的に正しいとは限りません。
</p>

<script src="script.js"></script>
</body>
</html>
